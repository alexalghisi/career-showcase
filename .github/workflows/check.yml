name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build
        run: flutter build web --release --base-href / --no-wasm-dry-run
